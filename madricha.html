<script>
        
  const menuBtn =
    document.getElementById("menuBtn");

  const sideMenu =
    document.getElementById("sideMenu");

  const overlay =
    document.getElementById("overlay");

  menuBtn.addEventListener("click", () => {

    sideMenu.classList.toggle("active");

    overlay.classList.toggle("active");

    menuBtn.classList.toggle("active");

  });

  overlay.addEventListener("click", closeMenu);

  function closeMenu() {

    sideMenu.classList.remove("active");

    overlay.classList.remove("active");

    menuBtn.classList.remove("active");
  }


</script>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue,
remove
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  apiKey: "AIzaSyB8S57Iqfi0p_1JgPlz2NT3upakyo-JYUc",

databaseURL:
"https://margemhot-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "margemhot",
  storageBucket: "margemhot.firebasestorage.app",
  messagingSenderId: "798968080375",
  appId: "1:798968080375:web:7e325f48fc16854bdb70f2"
};



const app = initializeApp(firebaseConfig);


const database = getDatabase(app);



let allResults=[];


const container =
document.getElementById("resultsContainer");



// ===============================
// טעינת מבחנים
// ===============================

function loadResults(){


const resultsRef =
ref(database,"testsResults");


onValue(resultsRef,(snapshot)=>{

    allResults=[];

    snapshot.forEach(child=>{
console.log(child.key);
console.log(child.val());
        allResults.push({

            id:child.key,
            ...child.val()

        });

    });

    buildTestsList();

    filterResults();

});
function buildTestsList(){

    const select =
    document.getElementById("testFilter");


    const tests =
    [...new Set(
        allResults
        .map(x=>x.testName)
        .filter(Boolean)
        .map(x=>x.trim())
    )];


    select.innerHTML =
    `<option value="">
        כל המבחנים
    </option>`;


    tests.sort().forEach(test=>{


        select.innerHTML +=
        `
        <option value="${test}">
            ${test}
        </option>
        `;


    });

}


}




// ===============================
// יצירת כרטיסיות
// ===============================


function displayResults(data){


container.innerHTML="";


if(data.length===0){


container.innerHTML=
`
<h2 style="text-align:center;color:#516b42">
לא נמצאו מבחנים
</h2>
`;


return;

}




data.forEach(result=>{


const card=document.createElement("div");


card.className="resultCard";


card.innerHTML=`

<h2>
${result.fullName || "ללא שם"}
</h2>


<p>
גדוד:
${result.battalion || "-"}
</p>


<p>
מבחן:
${result.testName || "-"}
</p>


<p>
ציון:
${result.score || 0}
</p>


<p>
תאריך:
${result.date || "-"}
</p>


<button class="deleteBtn">
מחיקת מבחן
</button>


`;



card.querySelector(".deleteBtn")
.onclick=()=>{


deleteResult(result.id);


};



container.appendChild(card);



});


}



// ===============================
// מחיקה
// ===============================


async function deleteResult(id){


if(!confirm("למחוק את המבחן?"))
return;



try{

console.log("מוחק:", id);
await remove(
ref(database,"testsResults/"+id)
);



}

catch(error){

console.error(
"שגיאה במחיקה:",
error
);

}


}




// ===============================
// חיפוש
// ===============================
document
.getElementById("searchInput")
.addEventListener("input",filterResults);

document
.getElementById("testFilter")
.addEventListener("change",filterResults);

document
.getElementById("dateFilter")
.addEventListener("change",filterResults);


function filterResults(){

    const text =
    document.getElementById("searchInput")
    .value
    .trim();

    const test =
    document.getElementById("testFilter")
    .value;

    const date =
    document.getElementById("dateFilter")
    .value;

    let filtered =
    allResults.filter(item=>{

        let okText =

            (item.fullName || "")
            .includes(text)

            ||

            (item.battalion || "")
            .includes(text);
let okTest =

test === "" ||

(item.testName || "").trim() === test.trim();
        let okDate=true;

        if(date){

            okDate=
            (item.date || "")
            .includes(date);

        }

        return okText && okTest && okDate;

    });

    displayResults(filtered);

}

// התחלה

loadResults();
